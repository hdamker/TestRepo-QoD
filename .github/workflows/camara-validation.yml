# CAMARA Validation Framework — Caller Workflow (test deployment)
#
# Points to hdamker/tooling@validation-framework for pre-RC testing.
# Production callers will use camaraproject/tooling@v1-rc.

name: CAMARA Validation

on:
  pull_request:
    branches:
      - main
      - release-snapshot/**
      - maintenance/**
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  issues: write
  contents: read
  statuses: write
  id-token: write

jobs:
  validation:
    uses: hdamker/tooling/.github/workflows/validation.yml@fix/post-release-sync-flat-mode
    secrets: inherit
