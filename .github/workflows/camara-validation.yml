# CAMARA Validation Framework — Caller Workflow
#
# Installed in API repositories by the CAMARA onboarding campaign
# (camaraproject/project-administration). No modification needed;
# all configuration is centralized in camaraproject/tooling.
#
# Replaces the legacy pr_validation_caller.yml (v0 validation).

name: CAMARA Validation

on:
  pull_request:
    branches:
      - main
      - release-snapshot/**
      - maintenance/**
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  issues: write
  contents: read
  statuses: write
  id-token: write

jobs:
  validation:
    uses: hdamker/tooling/.github/workflows/validation.yml@fix/p031-canonical-source-fallback
    # Fork test of tooling PR #317 (release-review canonical fallback).
    # Pin engine + shared-actions to the PR head SHA; the override hardcodes
    # camaraproject/tooling and the SHA is reachable via the open PR ref.
    with:
      tooling_ref_override: 1410e888b41d1d65db697f2ca8ba8f6782169019
    secrets: inherit
