# CAMARA Validation Framework — Caller Workflow
#
# Installed in API repositories by the CAMARA onboarding campaign
# (camaraproject/project-administration). No modification needed;
# all configuration is centralized in camaraproject/tooling.
#
# Replaces the legacy pr_validation_caller.yml (v0 validation).

name: CAMARA Validation

on:
  pull_request:
    branches:
      - main
      - release-snapshot/**
      - maintenance/**
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  issues: write
  contents: read
  statuses: write
  id-token: write

jobs:
  validation:
    uses: hdamker/tooling/.github/workflows/validation.yml@feat/p040-bundler-renaming-conflict
    # Fork test of the P-040 bundler component-renaming-conflict check. Do not set tooling_ref_override here:
    # the override path checks out camaraproject/tooling, while the OIDC path
    # resolves the tooling checkout to the called workflow SHA in hdamker/tooling.
    secrets: inherit
